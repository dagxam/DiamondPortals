# Основные настройки DiamondPortals.
# Технические названия материалов Minecraft оставлены на английском,
# потому что это внутренние значения API.

portal:
  # Включить или отключить работу кастомных порталов.
  enabled: true

  # Префикс имени автоматически создаваемого измерения.
  world-prefix: diamondportal_

  # Размер портала фиксирован и повторяет минимальный ванильный портал:
  # внешняя рамка 4x5 блоков, внутренняя область 2x3 блока.
  fixed-size: true

  # Задержка телепортации после входа в портал в секундах.
  teleport-delay-seconds: 0

  # Предмет активации. Обычное огниво, как у портала в Ад.
  ignition-item: FLINT_AND_STEEL

  # Разрешённые блоки для строительства рамки.
  # Рамка должна быть полностью построена из одного типа блока.
  allowed-materials:
    - DIAMOND_BLOCK
    - GOLD_BLOCK
    - IRON_BLOCK
    - EMERALD_BLOCK
    - COPPER_BLOCK
    - LAPIS_BLOCK
    - REDSTONE_BLOCK
    - AMETHYST_BLOCK
    - COAL_BLOCK
    - NETHERITE_BLOCK
    - QUARTZ_BLOCK

world:
  # Минимальная высота заполнения мира.
  min-height: 0

  # Максимальная высота, используемая генератором.
  max-height: 128

  # Базовая высота поверхности.
  surface-height: 64

  # Режим выбора зерна генерации мира.
  seed-mode: RANDOM
